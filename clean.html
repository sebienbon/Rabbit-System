<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Rabbit Tree · Room cleaning</title>
  <meta name="theme-color" content="#7B3FC9">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon-192.png" type="image/png">
  <style>
    @font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-400-normal.woff2) format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Nunito'; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); font-weight: 800; font-display: swap; }
    @font-face { font-family: 'Baloo 2'; src: url(fonts/baloo-2-latin-800-normal.woff2) format('woff2'); font-weight: 800; font-display: swap; }
    :root { --accent: #7B3FC9; --accent-bg: #F3EDFC; --ink: #33305C; --soft: #6B6796; --bg: #FFF7ED; --line: #E7DEF4; --ok: #0B6B61; --ok-bg: #D3F6F1; --warn: #8A3B00; --warn-bg: #FFE8D6;
      --sans: 'Nunito', system-ui, -apple-system, sans-serif; --display: 'Baloo 2', 'Nunito', system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.45 var(--sans); }
    header { background: linear-gradient(110deg, #7B3FC9 0%, #B8338A 52%, #C2520F 100%); padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
    header img.mark { height: 30px; width: auto; } header .name { height: 22px; width: auto; }
    main { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font: 800 1.6rem/1.15 var(--display); margin: 8px 0 4px; }
    .muted { color: var(--soft); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin: 14px 0; box-shadow: 0 8px 24px rgba(51,48,92,.06); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 16px; padding: 17px 18px; margin-top: 12px; font: 800 1.1rem var(--sans); cursor: pointer; }
    .btn.yes { background: linear-gradient(110deg, #087A6E, #137FA3); color: #fff; }
    .btn.no { background: var(--accent-bg); color: var(--accent); border: 2px solid var(--line); }
    .btn:disabled { opacity: .55; }
    .note { border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
    .note.ok { background: var(--ok-bg); color: var(--ok); } .note.warn { background: var(--warn-bg); color: var(--warn); }
    .big { text-align: center; font-size: 52px; line-height: 1; margin: 6px 0; }
  </style>
</head>
<body>
  <header>
    <img class="mark" src="img/logo-mark-white.png" alt="" width="18" height="30">
    <img class="name" src="img/logo-name-white.png" alt="The Rabbit Tree" width="110" height="22">
  </header>
  <main id="main"><p class="muted">Loading…</p></main>
  <noscript>This page needs JavaScript.</noscript>
  <script type="module">
    // Room cleaning during a stay (owner 24/11): the guest got this link by WhatsApp from the reception and says
    // yes or no. The link carries the booking, the day and a proof made by the server; nothing else is asked.
    import { api } from './js/api.js';
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const q = new URLSearchParams(location.hash.slice(1)), link = { b: q.get('b') || '', d: q.get('d') || '', t: q.get('t') || '' };
    const main = document.getElementById('main');
    let info = null, busy = false, error = '';
    function draw() {
      if (!info) { main.innerHTML = `<div class="card"><div class="big">🐇</div><p>${esc(error || 'Loading…')}</p></div>`; return; }
      const said = info.answer;
      main.innerHTML = `<h1>Hello ${esc(info.first)}!</h1>
        <div class="card"><p>Today we can clean your room <b>${esc(info.room)}</b>.</p><p><b>Would you like us to clean it?</b></p>
          ${said === 'yes' ? '<div class="note ok">✓ Thank you! We will clean your room today. Please keep your valuables in your locker.</div>' : ''}
          ${said === 'no' ? '<div class="note ok">✓ No problem — we will not come in today.</div>' : ''}
          ${error ? `<div class="note warn">${esc(error)}</div>` : ''}
          <button class="btn yes" data-a="yes" ${busy ? 'disabled' : ''}>${said === 'yes' ? '✓ ' : ''}Yes, please clean</button>
          <button class="btn no" data-a="no" ${busy ? 'disabled' : ''}>${said === 'no' ? '✓ ' : ''}No, thank you</button>
          ${said ? '<p class="muted" style="margin-top:12px">Changed your mind? Tap the other button.</p>' : ''}</div>`;
      main.querySelectorAll('[data-a]').forEach(b => b.onclick = () => send(b.dataset.a));
    }
    async function send(answer) {
      busy = true; error = ''; draw();
      try { info = await api('hk_answer', { ...link, ...(answer ? { answer } : {}) }); }
      catch (e) {
        error = e.code === 'expired' ? 'This link was for another day. Please ask the reception.'
          : e.code === 'bad_link' ? 'This link is not valid. Please ask the reception.'
          : 'No connection. Please try again.';
      }
      busy = false; draw();
    }
    send('');
  </script>
</body>
</html>
